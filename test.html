<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Game</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>
    <div class="buttons">
        <button id="btn-10" onclick="setRange(10, this)">0-10</button>
        <button id="btn-20" onclick="setRange(20, this)">0-20</button>
        <button id="btn-100" onclick="setRange(100, this)">0-100</button>
        <button id="btn-150" onclick="setRange(150, this)">0-150</button>
    </div>
    <div class="operations">
        <button onclick="generateNumbers('+')">+</button>
        <button onclick="generateNumbers('-')">-</button>
        <button onclick="generateNumbers('*')">*</button>
    </div>
    <div class="input-panel">
        <input type="text" id="first-number" readonly>
        <input type="text" id="operator" readonly>
        <input type="text" id="second-number" readonly>
        <span>=</span>
        <input type="text" id="result">
        <button onclick="showAnswer()">?</button>
        <input type="text" id="feedback" disabled value="???">
    </div>
    <div class="number-panel">
        <button class="number-button" onclick="addToResult(7)">7</button>
        <button class="number-button" onclick="addToResult(8)">8</button>
        <button class="number-button" onclick="addToResult(9)">9</button>
        <button class="number-button" onclick="addToResult(4)">4</button>
        <button class="number-button" onclick="addToResult(5)">5</button>
        <button class="number-button" onclick="addToResult(6)">6</button>
        <button class="number-button" onclick="addToResult(1)">1</button>
        <button class="number-button" onclick="addToResult(2)">2</button>
        <button class="number-button" onclick="addToResult(3)">3</button>
        <button class="number-button" onclick="addToResult(0)">0</button>
        <button class="submit-button" onclick="checkResult()">Submit</button>
    </div>
    <script>
        let maxRange = 10;
        function setRange(max, button) {
            maxRange = max;
            document.querySelectorAll('.buttons button').forEach(btn => btn.classList.remove('selected'));
            button.classList.add('selected');
        }
        function generateNumbers(op) {
            document.getElementById('first-number').value = Math.floor(Math.random() * (maxRange + 1));
            document.getElementById('second-number').value = Math.floor(Math.random() * (maxRange + 1));
            document.getElementById('operator').value = op;
            document.getElementById('feedback').value = "???";
        }
        function addToResult(num) {
            document.getElementById('result').value += num;
        }
        function checkResult() {
            let num1 = parseInt(document.getElementById('first-number').value);
            let num2 = parseInt(document.getElementById('second-number').value);
            let operator = document.getElementById('operator').value;
            let userResult = parseInt(document.getElementById('result').value);
            let correctResult;
            switch (operator) {
                case '+': correctResult = num1 + num2; break;
                case '-': correctResult = num1 - num2; break;
                case '*': correctResult = num1 * num2; break;
                default: return;
            }
            document.getElementById('feedback').value = userResult === correctResult ? "Correct!" : "Wrong! Try again.";
        }
        function showAnswer() {
            let num1 = parseInt(document.getElementById('first-number').value);
            let num2 = parseInt(document.getElementById('second-number').value);
            let operator = document.getElementById('operator').value;
            let correctResult;
            switch (operator) {
                case '+': correctResult = num1 + num2; break;
                case '-': correctResult = num1 - num2; break;
                case '*': correctResult = num1 * num2; break;
                default: return;
            }
            document.getElementById('feedback').value = correctResult;
        }
    </script>
</body>
</html>
