<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Dormitory Registration</title>
</head>
<body>
  <h1>Form</h1>
  <form id="dormForm">
    <label>Name: <input type="text" name="firstName" required></label><br>
    <label>Surname: <input type="text" name="lastName" required></label><br>
    <label>Number of Rooms: <input type="number" name="roomCount" min="1" required></label><br>
    <label>Special Requirements: <input type="text" name="specialReq"></label><br>
    <label>Stay Duration: <input type="number" name="stayDuration" min="1" required></label><br>
    <button type="submit">Send</button>
  </form>

  <h2>Display the Records</h2>
  <button onclick="loadRecords()">Reload the list</button>
  
  <table border="1" id="recordsTable" style="margin-top:1em; border-collapse: collapse;">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Surname</th>
        <th>Rooms</th>
        <th>Requirements</th>
        <th>Duration</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  
  <script>
    async function loadRecords() {
      const res = await fetch("/api/records");
      const records = await res.json();
      const tbody = document.querySelector("#recordsTable tbody");
      tbody.innerHTML = "";
  
      for (const record of records) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${record.id}</td>
          <td>${record.firstName}</td>
          <td>${record.lastName}</td>
          <td>${record.roomCount}</td>
          <td>${record.specialReq || ""}</td>
          <td>${record.stayDuration}</td>
          <td><button onclick="deleteRecord(${record.id})">Delete</button></td>
        `;
        tbody.appendChild(tr);
      }
    }
  
    async function deleteRecord(id) {
      if (!confirm("Are you sure you want to delete the record?")) return;
  
      const res = await fetch(`/api/records/${id}`, {
        method: "DELETE",
      });
  
      const result = await res.json();
      alert(result.message);
      loadRecords(); 
    }
  </script>  

  <script>
    document.getElementById("dormForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      const response = await fetch("/api/records", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });

      const result = await response.json();
      alert(result.message);
    });
  </script>
</body>
</html>
